[package]
description = "Reading vortex-ohlc's files from DataFusion: a Vortex format with vortex-ohlc registered, and the df bench"
edition.workspace = true
name = "datafusion-vortex-ohlc"
version = "0.1.0"

[dependencies]
vortex-ohlc.workspace = true

arrow.workspace = true
datafusion.workspace = true
futures.workspace = true
vortex.workspace = true
vortex-datafusion.workspace = true

[dev-dependencies]
datafusion-vortex-prune.workspace = true
test-util.workspace = true

criterion.workspace = true
parquet = { features = ["snap", "zstd"], workspace = true }
regex.workspace = true
tempfile.workspace = true
tokio = { features = ["macros", "rt-multi-thread"], workspace = true }

[lints]
workspace = true

[[bench]]
harness = false
name = "df"
