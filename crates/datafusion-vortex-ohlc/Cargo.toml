[package]
description = "Reading vortex-ohlc's files from DataFusion: a Vortex format with vortex-ohlc registered, and the df bench"
edition.workspace = true
name = "datafusion-vortex-ohlc"
version = "0.1.0"

[dependencies]
arrow.workspace = true
datafusion.workspace = true
futures.workspace = true
vortex.workspace = true
vortex-datafusion.workspace = true
vortex-ohlc = { path = "../vortex-ohlc" }

[dev-dependencies]
criterion.workspace = true
datafusion-vortex-prune = { path = "../datafusion-vortex-prune" }
parquet = { features = ["snap", "zstd"], workspace = true }
regex.workspace = true
tempfile.workspace = true
test-util = { path = "../test-util" }
tokio = { features = ["macros", "rt-multi-thread"], workspace = true }

[lints]
workspace = true

[[bench]]
harness = false
name = "df"
