[package]
description = "Reading vortex-ohlc's files from DataFusion as the source they were written from: the prices rebuilt from their parts, rescaled decimals at their source scale, and filters on them pushed into Vortex"
edition.workspace = true
name = "datafusion-vortex-ohlc"
version = "0.1.0"

[dependencies]
arrow.workspace = true
datafusion.workspace = true
futures.workspace = true
vortex.workspace = true
vortex-datafusion.workspace = true
vortex-ohlc = { path = "../vortex-ohlc" }

[dev-dependencies]
criterion.workspace = true
datafusion-vortex-prune = { path = "../datafusion-vortex-prune" }
parquet = { features = ["snap", "zstd"], workspace = true }
regex.workspace = true
tokio = { features = ["rt-multi-thread"], workspace = true }

[lints]
workspace = true

[[bench]]
harness = false
name = "df"
