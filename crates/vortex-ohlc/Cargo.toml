[package]
description = "OHLC bars in Vortex with only Vortex's own encodings: decimals rescaled, the four prices stored as one struct of parts, and the write strategy for them"
edition.workspace = true
name = "vortex-ohlc"
version = "0.1.0"

[dependencies]
arrow.workspace = true
async-trait.workspace = true
datafusion.workspace = true
futures.workspace = true
num-traits.workspace = true
roaring = "0.11"
serde_json.workspace = true
tokio = { features = ["rt"], workspace = true }
vortex.workspace = true
vortex-datafusion.workspace = true

[dev-dependencies]
criterion.workspace = true
parquet = { features = ["snap", "zstd"], workspace = true }
regex.workspace = true
tokio = { features = ["rt-multi-thread"], workspace = true }

[lints]
workspace = true

[[bench]]
harness = false
name = "scan"

[[bench]]
harness = false
name = "needle"

[[bench]]
harness = false
name = "df"
