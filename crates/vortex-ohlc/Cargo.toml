[package]
description = "OHLC bars in Vortex: the four prices stored as one struct of parts under a layout of their own, and decimals divided by a power of ten per block"
edition.workspace = true
name = "vortex-ohlc"
version = "0.1.0"

[dependencies]
arrow.workspace = true
async-trait.workspace = true
fastlanes.workspace = true
futures.workspace = true
num-traits.workspace = true
prost.workspace = true
vortex.workspace = true
# The encoding macros name these crates, and the compressor's scheme API is only partly in `vortex`.
vortex-array.workspace = true
vortex-btrblocks.workspace = true
vortex-compressor.workspace = true
vortex-error.workspace = true

[dev-dependencies]
test-util.workspace = true

# The `dft` bench, which writes and reads the files through dft.
clap.workspace = true
datafusion-app = { features = ["vortex"], workspace = true }
datafusion-dft = { features = ["vortex"], workspace = true }
tokio = { features = ["rt-multi-thread"], workspace = true }

[lints]
workspace = true

[[bench]]
harness = false
name = "dft"
